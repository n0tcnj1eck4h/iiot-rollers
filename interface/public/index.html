<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Blinds Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-blinds"></i> Smart Blinds Control</h1>
            <div class="status-indicator" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <main>
            <div class="control-panel">
                <div class="blinds-visualization">
                    <div class="blinds-track">
                        <div class="blinds-slat" id="blinds-position"></div>
                    </div>
                    <div class="position-display" id="position-display">50%</div>
                </div>

                <div class="controls">
                    <div class="slider-container">
                        <label for="position-slider">Position:</label>
                        <input type="range" id="position-slider" min="0" max="100" value="50">
                    </div>

                    <div class="slider-container">
                        <label for="speed-slider">Speed:</label>
                        <input type="range" id="speed-slider" min="0" max="100" value="50">
                    </div>

                    <div class="preset-buttons">
                        <button class="btn preset" data-position="0"><i class="fas fa-angle-up"></i> Open</button>
                        <button class="btn preset" data-position="50"><i class="fas fa-adjust"></i> Half</button>
                        <button class="btn preset" data-position="100"><i class="fas fa-angle-down"></i> Close</button>
                    </div>

                    <button class="btn primary" id="apply-btn">Apply</button>
                </div>
            </div>

            <div class="status-panel">
                <h2>Blinds Status</h2>
                <div class="status-info">
                    <div><span class="label">Current Position:</span> <span id="current-position">-</span></div>
                    <div><span class="label">Current Speed:</span> <span id="current-speed">-</span></div>
                    <div><span class="label">Last Update:</span> <span id="last-update">-</span></div>
                </div>
                <button class="btn secondary" id="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh Status</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
