<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rolety</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>System sterowania roletami okiennymi</h1>
      </header>

      <div class="dashboard" id="shutterDashboard"></div>

      <div class="add-shutter-form">
        <h2 class="form-title">Dodaj urządzenie</h2>
        <form id="addShutterForm">
          <div class="form-group">
            <input
              type="text"
              id="shutterName"
              placeholder="Nazwa urządzenia"
              required
            />
          </div>

          <div class="form-group">
            <input
              type="text"
              id="shutterStatus"
              placeholder="Adres MQTT 1"
              required
            />
          </div>

          <div class="form-group">
            <input
              type="text"
              id="shutterCommand"
              placeholder="Adres MQTT 2"
              required
            />
          </div>

          <button type="submit" class="submit-btn">Dodaj</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
